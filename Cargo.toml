[package]
name = "csx"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Pure Rust continuous-structure geometry and material modeling, compatible with CSXCAD and openEMS"
repository = "https://github.com/KarpelesLab/csx"
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]
keywords = ["csxcad", "openems", "geometry", "fdtd", "electromagnetics"]
categories = ["science", "simulation", "mathematics"]

[features]
default = ["xml"]
## CSXCAD / openEMS XML reader and writer (in-tree, no external dependencies).
xml = []

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[[example]]
name = "info"
required-features = ["xml"]

[[example]]
name = "patch_antenna"
required-features = ["xml"]

[[example]]
name = "export_vtk"
required-features = ["xml"]

[[example]]
name = "discretize"
required-features = ["xml"]

[[test]]
name = "end_to_end"
required-features = ["xml"]
